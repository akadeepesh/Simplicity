version: 2

# Every dependency update (npm + GitHub Actions, major/minor/patch) lands in
# ONE weekly pull request. Squash-merge it to keep main's history clean.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: npm
    directory: /simplicity
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    ignore:
      # typescript-eslint (via eslint-config-next) does not support TS 7 yet
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint-plugin-import (via eslint-config-next) peers on eslint <=9
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # keep in step with the Node 22 runtime used in CI
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
